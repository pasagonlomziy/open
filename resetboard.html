<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard - CPE Open House</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (Firestore v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDxRlfiL80TUoeyQDk93PQ5A0W3e37PoSI",
            authDomain: "elon-musk-c6fa9.firebaseapp.com",
            projectId: "elon-musk-c6fa9",
            storageBucket: "elon-musk-c6fa9.firebasestorage.app",
            messagingSenderId: "609890115150",
            appId: "1:609890115150:web:428937710422523698ed1f",
            measurementId: "G-WTHXDEWJMR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 🏆 ฟังก์ชันล้างกระดานคะแนน Leaderboard ทั้งหมดบน Cloud
        window.clearCloudLeaderboard = async function() {
            if (!confirm("⚠️ คุณต้องการลบกระดานคะแนนทั้งหมดบน Cloud ใช่หรือไม่? (ไม่สามารถกู้คืนได้)")) return;
            try {
                const querySnapshot = await getDocs(collection(db, "leaderboard"));
                const deletePromises = [];
                querySnapshot.forEach((document) => {
                    deletePromises.push(deleteDoc(doc(db, "leaderboard", document.id)));
                });
                await Promise.all(deletePromises);
                localStorage.removeItem('cpe_quiz_lb_stack');
                alert("✅ ล้างกระดานคะแนนทั้งหมดเรียบร้อยแล้ว!");
            } catch (e) {
                console.error("Error clearing leaderboard:", e);
                alert("❌ เกิดข้อผิดพลาดในการลบข้อมูล: " + e.message);
            }
        };

        // 🗑️ ฟังก์ชันล้าง Log รายชื่อผู้ใช้งานทั้งหมดบน Cloud
        window.clearCloudUserLogs = async function() {
            if (!confirm("⚠️ คุณต้องการลบ Log รายชื่อผู้ใช้งานทั้งหมดใช่หรือไม่?")) return;
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                const deletePromises = [];
                querySnapshot.forEach((document) => {
                    deletePromises.push(deleteDoc(doc(db, "users", document.id)));
                });
                await Promise.all(deletePromises);
                alert("✅ ล้าง Log รายชื่อผู้ใช้งานทั้งหมดเรียบร้อยแล้ว!");
            } catch (e) {
                console.error("Error clearing user logs:", e);
                alert("❌ เกิดข้อผิดพลาดในการลบข้อมูล: " + e.message);
            }
        };
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #f1f5f9;
            font-family: 'Kanit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .admin-card {
            background: #ffffff;
            border-radius: 24px;
            width: 90%;
            max-width: 460px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
            border-top: 6px solid #ef4444;
        }

        .admin-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .admin-subtitle {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 24px;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .admin-btn {
            width: 100%;
            padding: 13px 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Kanit', sans-serif;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .admin-btn:active {
            transform: translateY(1px);
        }

        /* Colors */
        .btn-orange { background: #f97316; color: #ffffff; }
        .btn-amber { background: #f59e0b; color: #ffffff; }
        .btn-red { background: #ef4444; color: #ffffff; }
        .btn-darkred { background: #991b1b; color: #ffffff; }
        .btn-light { background: #e2e8f0; color: #334155; }
        .btn-dark { background: #1e293b; color: #ffffff; }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-buttons .admin-btn {
            flex: 1;
            font-size: 13px;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <div class="admin-title">⚙️ ผู้ดูแลระบบ (Admin)</div>
        <div class="admin-subtitle">ศูนย์ควบคุมและรีเซ็ตข้อมูล CPE Open House</div>

        <div class="btn-list">
            <!-- ปุ่ม Log คะแนน -->
            <button class="admin-btn btn-orange" onclick="showLogsNotif()">
                📋 ดู Log รายชื่อและรายละเอียดคะแนน
            </button>

            <!-- 🔓 ปุ่มปลดล็อกสิทธิ์เครื่องนี้ -->
            <button class="admin-btn btn-amber" onclick="unlockThisDevice()">
                🔓 ปลดล็อกสิทธิ์การทำแบบทดสอบ (เครื่องนี้)
            </button>

            <!-- ปุ่มล้างข้อมูลบน Cloud -->
            <button class="admin-btn btn-red" onclick="window.clearCloudLeaderboard()">
                🏆 ล้างกระดานคะแนนทั้งหมด (Cloud)
            </button>

            <button class="admin-btn btn-darkred" onclick="window.clearCloudUserLogs()">
                🗑️ ล้าง Log รายชื่อผู้ใช้งานทั้งหมด (Cloud)
            </button>
        </div>

        <!-- ปุ่มย้อนกลับ -->
        <div class="nav-buttons">
            <a href="quiz.html" class="admin-btn btn-light">← กลับหน้าแบบทดสอบ</a>
            <a href="index.html" class="admin-btn btn-dark">🏠 หน้าหลัก</a>
        </div>
    </div>

    <script>
        // 🔓 ฟังก์ชันลบสิทธิ์การเล่นเพื่อปลดล็อกเครื่องให้เล่นใหม่ได้
        function unlockThisDevice() {
            localStorage.removeItem("cpe_quiz_played");
            alert("🔓 ปลดล็อกสิทธิ์การทำแบบทดสอบบนเครื่องนี้เรียบร้อยแล้ว!\nคุณสามารถกดกลับไปที่หน้าแบบทดสอบเพื่อเริ่มเล่นใหม่ได้ทันที");
        }

        function showLogsNotif() {
            alert("📋 ระบบกำลังดึง Log คะแนนจากเซิร์ฟเวอร์ Cloud...");
        }
    </script>
</body>
</html>
