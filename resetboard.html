<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ผู้ดูแลระบบ (Admin) - CPE Open House</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK (Firestore v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDxRlfiL80TUoeyQDk93PQ5A0W3e37PoSI",
            authDomain: "elon-musk-c6fa9.firebaseapp.com",
            projectId: "elon-musk-c6fa9",
            storageBucket: "elon-musk-c6fa9.firebasestorage.app",
            messagingSenderId: "609890115150",
            appId: "1:609890115150:web:428937710422523698ed1f",
            measurementId: "G-WTHXDEWJMR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ตัวแปรเก็บสถานะการเรียงลำดับ (ค่าเริ่มต้น: วันที่ล่าสุดขึ้นก่อน)
        let currentSortField = 'date';
        let currentSortOrder = 'desc';

        // 🗑️ ฟังก์ชันลบข้อมูลรายชื่อรายบุคคล
        window.deleteSingleLog = async function(docId, name) {
            if (!confirm(`⚠️ คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลของ "${name}" ?`)) return;

            try {
                await deleteDoc(doc(db, "leaderboard", docId));
                window.fetchLogs(); // รีเฟรชตารางหลังลบสำเร็จ
            } catch (e) {
                console.error(e);
                alert("❌ เกิดข้อผิดพลาดในการลบ: " + e.message);
            }
        };

        // 📊 ฟังก์ชันคำนวณคะแนน
        function getScoreVal(item) {
            if (item.correctTotal !== undefined) return Number(item.correctTotal);
            if (item.score !== undefined) return Math.floor(Number(item.score) / 100);
            return 0;
        }

        // ⏱️ ฟังก์ชันแปลงวันที่เพื่อเปรียบเทียบเวลา
        function getDateVal(item) {
            if (item.createdAt) {
                if (item.createdAt.seconds) return item.createdAt.seconds;
                if (item.createdAt instanceof Date) return item.createdAt.getTime();
            }
            if (item.date) {
                const parts = String(item.date).trim().split(' ');
                if (parts.length === 2) {
                    const d = parts[0].split('/');
                    const t = parts[1].split(':');
                    if (d.length === 3 && t.length === 2) {
                        return Number(`${d[2]}${d[1].padStart(2,'0')}${d[0].padStart(2,'0')}${t[0].padStart(2,'0')}${t[1].padStart(2,'0')}`);
                    }
                }
            }
            return 0;
        }

        // 🔄 ฟังก์ชันสลับการเรียงลำดับเมื่อกดหัวตาราง
        window.sortBy = function(field) {
            if (currentSortField === field) {
                currentSortOrder = (currentSortOrder === 'desc') ? 'asc' : 'desc';
            } else {
                currentSortField = field;
                currentSortOrder = 'desc'; // ค่าเริ่มต้นเมื่อเปลี่ยนหัวข้อ ให้เรียงจากมากไปน้อย/ล่าสุดไปเก่าสุด
            }
            window.renderTable();
        };

        // 🎨 ฟังก์ชันวาดตารางและอัปเดตลูกศรสถานะ
        window.renderTable = function() {
            if (!window.currentLogs || window.currentLogs.length === 0) return;

            // คัดลอกและจัดเรียงข้อมูล
            let sorted = [...window.currentLogs];
            sorted.sort((a, b) => {
                let valA = currentSortField === 'score' ? getScoreVal(a) : getDateVal(a);
                let valB = currentSortField === 'score' ? getScoreVal(b) : getDateVal(b);

                if (valA < valB) return currentSortOrder === 'asc' ? -1 : 1;
                if (valA > valB) return currentSortOrder === 'asc' ? 1 : -1;
                return 0;
            });

            // อัปเดตลูกศรบนหัวตาราง
            const scoreIcon = currentSortField === 'score' ? (currentSortOrder === 'desc' ? ' ⬇️' : ' ⬆️') : ' ↕️';
            const dateIcon = currentSortField === 'date' ? (currentSortOrder === 'desc' ? ' ⬇️ (ล่าสุด)' : ' ⬆️ (เก่าสุด)') : ' ↕️';

            document.getElementById('th-score').innerHTML = `คะแนน ${scoreIcon}`;
            document.getElementById('th-date').innerHTML = `วันที่ทำรายการ ${dateIcon}`;

            // แสดงผลลงในตาราง
            const tbody = document.getElementById('log-table-body');
            tbody.innerHTML = '';
            sorted.forEach((item, idx) => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-slate-100 hover:bg-amber-50/40 text-xs sm:text-sm text-slate-700 transition-colors';
                const safeName = String(item.name || '-').replace(/'/g, "\\'");
                const scoreVal = getScoreVal(item);
                
                tr.innerHTML = `
                    <td class="py-2.5 px-3 text-center font-bold text-slate-400">${idx + 1}</td>
                    <td class="py-2.5 px-3 font-semibold text-slate-800">${item.name || '-'}</td>
                    <td class="py-2.5 px-3 text-slate-600">${item.school || '-'}</td>
                    <td class="py-2.5 px-3 text-center font-bold text-orange-600">${scoreVal}/10</td>
                    <td class="py-2.5 px-3 text-center text-slate-500 font-medium">${item.date || '-'}</td>
                    <td class="py-2.5 px-3 text-center">
                        <button onclick="deleteSingleLog('${item.id}', '${safeName}')" 
                                class="bg-rose-500 hover:bg-rose-600 text-white font-bold px-2.5 py-1 rounded-lg text-xs shadow-sm active:scale-95 transition cursor-pointer">
                            🗑️ ลบ
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        };

        // 1. ดึงข้อมูล Log รายชื่อและคะแนนจาก Cloud
        window.fetchLogs = async function() {
            const modal = document.getElementById('log-modal');
            const tbody = document.getElementById('log-table-body');
            
            tbody.innerHTML = '<tr><td colspan="6" class="py-6 text-center text-amber-600 font-bold">⏳ กำลังโหลดข้อมูลจาก Cloud...</td></tr>';
            modal.style.display = 'flex';

            try {
                const querySnapshot = await getDocs(collection(db, "leaderboard"));
                let logs = [];
                querySnapshot.forEach((docSnap) => {
                    logs.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="py-6 text-center text-slate-400">ยังไม่มีข้อมูล Log ในระบบ</td></tr>';
                    return;
                }

                window.currentLogs = logs;
                window.renderTable(); // วาดตารางครั้งแรกพร้อมเรียงลำดับ
            } catch (e) {
                console.error(e);
                tbody.innerHTML = '<tr><td colspan="6" class="py-6 text-center text-red-500 font-bold">❌ เกิดข้อผิดพลาดในการดึงข้อมูล</td></tr>';
            }
        };

        // 2. ปลดล็อกสิทธิ์ทำแบบทดสอบ (เครื่องนี้)
        window.unlockDevice = function() {
            localStorage.removeItem("cpe_quiz_played");
            const btn = document.getElementById("btn-unlock");
            if (btn) {
                btn.innerText = "✅ ปลดล็อกเครื่องนี้เรียบร้อยแล้ว!";
                setTimeout(() => {
                    btn.innerText = "🔓 ปลดล็อกสิทธิ์การทำแบบทดสอบ (เครื่องนี้)";
                }, 2500);
            }
        };

        // 3. ล้างกระดานคะแนนทั้งหมด (Cloud)
        window.clearLeaderboardCloud = async function() {
            if (!confirm("⚠️ คุณต้องการล้างกระดานคะแนนทั้งหมดบน Cloud ใช่หรือไม่?")) return;

            try {
                const querySnapshot = await getDocs(collection(db, "leaderboard"));
                const deletePromises = [];
                querySnapshot.forEach((docSnap) => {
                    deletePromises.push(deleteDoc(doc(db, "leaderboard", docSnap.id)));
                });
                await Promise.all(deletePromises);
                localStorage.removeItem("cpe_quiz_lb_stack");
                
                const tbody = document.getElementById('log-table-body');
                if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="py-6 text-center text-slate-400">ล้างข้อมูลสำเร็จแล้ว</td></tr>';
            } catch (e) {
                console.error(e);
            }
        };

        // 4. ล้าง Log ทั้งหมด
        window.clearUserLogsCloud = async function() {
            if (!confirm("⚠️ คุณต้องการล้าง Log ทั้งหมดบน Cloud ใช่หรือไม่?")) return;
            await window.clearLeaderboardCloud();
        };

        // 5. ส่งออกไฟล์ CSV
        window.exportCSV = function() {
            if (!window.currentLogs || window.currentLogs.length === 0) return;
            
            let csvContent = "data:text/csv;charset=utf-8,\uFEFFลำดับ,ชื่อ-นามสกุล,สังกัด/โรงเรียน,คะแนน,วันที่\n";
            window.currentLogs.forEach((item, idx) => {
                const name = `"${item.name || ''}"`;
                const school = `"${item.school || ''}"`;
                const score = getScoreVal(item);
                const date = `"${item.date || ''}"`;
                csvContent += `${idx + 1},${name},${school},${score},${date}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `CPE_Quiz_Logs_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #0f172a;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- กล่องเมนูหลัก ผู้ดูแลระบบ -->
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl border-t-8 border-orange-500 text-center relative">
        
        <div class="text-3xl mb-1">⚙️</div>
        <h1 class="text-xl sm:text-2xl font-black text-slate-800">ผู้ดูแลระบบ (Admin)</h1>
        <p class="text-xs text-slate-500 mb-6 font-medium">ศูนย์ควบคุมและแก้ข้อมูล CPE Open House</p>

        <div class="space-y-3">
            <!-- ปุ่มที่ 1 -->
            <button onclick="fetchLogs()" class="w-full bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-700 hover:to-amber-800 text-white font-bold py-3 px-4 rounded-xl shadow-md active:scale-95 transition-all text-xs sm:text-sm flex items-center justify-center gap-2">
                📄 ดู Log รายชื่อและรายละเอียดคะแนน
            </button>

            <!-- ปุ่มที่ 2 -->
            <button id="btn-unlock" onclick="unlockDevice()" class="w-full bg-gradient-to-r from-yellow-600 to-amber-600 hover:from-yellow-700 hover:to-amber-700 text-white font-bold py-3 px-4 rounded-xl shadow-md active:scale-95 transition-all text-xs sm:text-sm flex items-center justify-center gap-2">
                🔓 ปลดล็อกสิทธิ์การทำแบบทดสอบ (เครื่องนี้)
            </button>

            <!-- ปุ่มที่ 3 -->
            <button onclick="clearLeaderboardCloud()" class="w-full bg-gradient-to-r from-red-600 to-rose-700 hover:from-red-700 hover:to-rose-800 text-white font-bold py-3 px-4 rounded-xl shadow-md active:scale-95 transition-all text-xs sm:text-sm flex items-center justify-center gap-2">
                ❓ ล้างกระดานคะแนนทั้งหมด (Cloud)
            </button>

            <!-- ปุ่มที่ 4 -->
            <button onclick="clearUserLogsCloud()" class="w-full bg-gradient-to-r from-rose-800 to-red-900 hover:from-rose-900 hover:to-red-950 text-white font-bold py-3 px-4 rounded-xl shadow-md active:scale-95 transition-all text-xs sm:text-sm flex items-center justify-center gap-2">
                🗑️ ล้าง Log รายชื่อผู้ใช้งานทั้งหมด (Cloud)
            </button>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-100 flex gap-2">
            <a href="quiz.html" class="flex-1 bg-slate-100 text-slate-700 font-bold py-2.5 rounded-xl hover:bg-slate-200 transition-colors text-xs flex items-center justify-center gap-1">
                &larr; กลับหน้าแบบทดสอบ
            </a>
            <a href="index.html" class="flex-1 bg-slate-800 text-white font-bold py-2.5 rounded-xl hover:bg-slate-900 transition-colors text-xs flex items-center justify-center gap-1">
                🏠 หน้าหลัก
            </a>
        </div>
    </div>

    <!-- Modal แสดงตาราง Log พร้อมปุ่มเรียงลำดับหัวตาราง -->
    <div id="log-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-40">
        <div class="bg-white rounded-2xl w-full max-w-3xl max-h-[85vh] flex flex-col overflow-hidden shadow-2xl border-t-8 border-amber-500">
            <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <h3 class="font-bold text-slate-800 text-sm sm:text-base flex items-center gap-2">
                    📄 Log รายชื่อและคะแนนผู้เล่น (Cloud)
                </h3>
                <button onclick="document.getElementById('log-modal').style.display='none'" class="text-slate-400 hover:text-slate-700 text-xl font-bold px-2">&times;</button>
            </div>
            
            <div class="p-4 overflow-y-auto flex-grow">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs uppercase font-bold border-b border-slate-200">
                            <th class="py-2.5 px-3 text-center w-12">#</th>
                            <th class="py-2.5 px-3">ชื่อ-นามสกุล</th>
                            <th class="py-2.5 px-3">สังกัด/โรงเรียน</th>
                            
                            <!-- ปุ่มกดเรียงคะแนน -->
                            <th id="th-score" onclick="sortBy('score')" class="py-2.5 px-3 text-center cursor-pointer hover:bg-amber-100/60 select-none transition-colors rounded-t-lg text-orange-600" title="คลิกเพื่อเรียงลำดับคะแนน">
                                คะแนน ↕️
                            </th>
                            
                            <!-- ปุ่มกดเรียงวันที่ -->
                            <th id="th-date" onclick="sortBy('date')" class="py-2.5 px-3 text-center cursor-pointer hover:bg-amber-100/60 select-none transition-colors rounded-t-lg" title="คลิกเพื่อเรียงตามเวลาที่ทำ">
                                วันที่ทำรายการ ⬇️ (ล่าสุด)
                            </th>
                            
                            <th class="py-2.5 px-3 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="log-table-body">
                        <!-- โหลดข้อมูลแบบ Dynamic -->
                    </tbody>
                </table>
            </div>

            <div class="p-3 bg-slate-50 border-t border-slate-200 flex justify-between gap-2">
                <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1.5 transition-colors">
                    📥 ส่งออกไฟล์ Excel (CSV)
                </button>
                <button onclick="document.getElementById('log-modal').style.display='none'" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl text-xs transition-colors">
                    ปิดหน้าต่าง
                </button>
            </div>
        </div>
    </div>

</body>
</html>
