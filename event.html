<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f0e8">
    <title>ประกาศงานกิจกรรม — Open House</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background:#f4f0e8; color:#222522; font-family:"Noto Sans Thai","Leelawadee UI",sans-serif; }
        .page { background-image:linear-gradient(#ded9ce 1px,transparent 1px); background-size:100% 42px; }
        @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms !important; } }
    </style>
</head>
<body class="min-h-screen">
    <main class="page min-h-screen px-5 py-10 sm:px-8 sm:py-16">
        <article class="mx-auto max-w-2xl">
            <!-- Nav Header -->
            <nav class="mb-8 flex items-center justify-between border-b border-[#bdb7aa] pb-3 text-xs font-medium tracking-wide text-[#5f625c]">
                <span>OPEN HOUSE <span class="mx-1 text-[#bb5538]">/</span> คณะวิศวกรรมศาสตร์</span>
                <span>ประกาศงานกิจกรรม</span>
            </nav>
            
            <!-- Header Title -->
            <header class="mb-8">
                <p class="mb-2 text-xs font-bold tracking-widest text-[#bb5538] uppercase">Events & Announcements</p>
                <h1 class="text-3xl font-bold leading-tight tracking-tight sm:text-5xl">ประกาศงานกิจกรรม</h1>
                <p class="mt-4 text-base sm:text-lg font-bold leading-relaxed text-[#bb5538]">
                    "ติดตามข่าวสาร กำหนดการ และกิจกรรมของสาขาวิชาวิศวกรรมคอมพิวเตอร์"
                </p>
            </header>
            
            <!-- Content Block (เตรียมพื้นที่สำหรับใส่รายการกิจกรรมในอนาคต) -->
            <section class="border-t-2 border-[#222522] pt-6 space-y-6 text-sm sm:text-base text-[#444742]">
                <div class="border border-dashed border-[#bdb7aa] p-10 text-center rounded-sm bg-[#fffdf8]">
                    <p class="font-medium text-[#77796f]">พื้นที่สำหรับใส่ประกาศข่าวสาร ตารางเวลา และรายละเอียดกิจกรรม</p>
                </div>
            </section>

            <!-- Footer -->
            <footer class="mt-10 flex items-center justify-between border-t border-[#bdb7aa] pt-6">
                <p class="text-xs sm:text-sm text-[#77796f]">Computer Engineering Open House</p>
                <button onclick="history.back()" class="rounded-sm border border-[#222522] px-4 py-2 text-xs sm:text-sm font-medium transition-colors hover:bg-[#222522] hover:text-[#f4f0e8] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#bb5538]">← กลับหน้าหลัก</button>
            </footer>
        </article>
    </main>
</body>
</html>
